<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Chat</title>
  </head>
  <body>
    <div>
      <h1 align="left" style="color: rgb(0, 219, 11)">Web Chat</h1>
      <div>
        <input
          type="text"
          id="roomInput"
          placeholder="Enter room Name"
          required
        />
        <button onclick="joinRoom()">Join Room</button>
        <ul id="ActiveRooms"></ul>
      </div>
      <div id="chatContainer" hidden>
        <h2>
          <b>Room :<span id="ws-room-id"></span> </b>
        </h2>
        <b>your id: <span id="ws-id"></span></b>

        <ul id="messages"></ul>
        <form
          action=""
          onsubmit="sendmessage(event)"
          style="width: 1120px; height: 100px"
        >
          <input
            type="text"
            id="messageText"
            placeholder="Enter your message"
            autocomplete="off"
          />
          <button>Submit</button>
        </form>
      </div>
    </div>
    <script>
      var client_id = Date.now();
      document.querySelector("#ws-id").textContent = client_id;
      let ws = null;
      let room_id = null;

      function getActiveRooms() {
        var activeRoomList = document.getElementById("ActiveRooms");
        fetch("/get_rooms")
          .then((response) => response.json())
          .then((data) => {
            activeRoomList.innerHTML = "";
            if (data.length == 0) {
              var li = document.createElement("li");
              li.textContent = "No Active Rooms";
              activeRoomList.appendChild(li);
            } else {
              data.forEach((element) => {
                var li = document.createElement("li");
                li.textContent = element;
                activeRoomList.appendChild(li);
              });
            }
          });
      }

      getActiveRooms();

      function joinRoom() {
        room_id = document.getElementById("roomInput").value.trim();
        if (!room_id) {
          alert("Please enter a room name.");
          return;
        }
        ws = new WebSocket(`ws://localhost:8000/ws/${room_id}/${client_id}`);
        ws.onmessage = function (event) {
          var messages = document.getElementById("messages");
          var message = document.createElement("li");
          var content = document.createTextNode(event.data);
          message.appendChild(content);
          messages.appendChild(message);
        };
        ws.onopen = function () {
          getActiveRooms();
          document.getElementById("chatContainer").hidden = false;
          document.getElementById("ws-room-id").textContent = room_id;
          document.getElementById("ActiveRooms").hidden = true;
        };
      }
      function sendmessage(event) {
        event.preventDefault();
        var input = document.getElementById("messageText");
        if (ws !== null && ws.readyState === WebSocket.OPEN) {
          ws.send(input.value);
          input.value = "";
        }
      }
    </script>
  </body>
</html>
